version: '3.8'

services:
  agent-sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    container_name: antigravity_isolated_sandbox
    user: "1000:1000"
    volumes:
      - ./:/workspace:rw
    # Resource caps: prevent 100% RAM freezes
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4096M
    network_mode: bridge
    stdin_open: true
    tty: true
