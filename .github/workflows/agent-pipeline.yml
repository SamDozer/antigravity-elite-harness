name: AI Agent CI/CD & Security Verification Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-preflight:
    name: 🔒 Pre-Flight Security & Secret Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks Secret Audit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Semgrep SAST Analysis
        uses: returntocorp/semgrep-action@v1
        with:
          config: >-
            p/security-audit
            p/secrets
            p/owasp-top-ten
          generateSarif: "1"

      - name: OSV Dependency Vulnerability Scan
        uses: google/osv-scanner-action@v1.9.0
        with:
          scan-args: |-
            --recursive
            ./

  quality-gate-node:
    name: 🧪 Node.js Quality & Mutation Gate
    runs-on: ubuntu-latest
    needs: security-preflight
    if: hashFiles('package.json') != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter & Typecheck
        run: |
          npm run lint --if-present
          npm run typecheck --if-present

      - name: Run Tests with Coverage
        run: npm test -- --coverage

      - name: Run Stryker Mutation Testing (if configured)
        run: |
          if [ -f "stryker.config.json" ]; then
            npx stryker run --check-thresholds
          else
            echo "No stryker.config.json found; skipping mutation tests."
          fi

  quality-gate-python:
    name: 🧪 Python Quality & Property Gate
    runs-on: ubuntu-latest
    needs: security-preflight
    if: hashFiles('requirements.txt', 'pyproject.toml') != ''
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff pytest pytest-cov hypothesis mutmut

      - name: Lint with Ruff
        run: ruff check .

      - name: Run Pytest & Hypothesis Property Tests
        run: pytest --cov=. --cov-report=term-missing

      - name: Run Mutmut Mutation Testing (if configured)
        run: |
          if [ -f "setup.cfg" ] || [ -f "mutmut.ini" ]; then
            mutmut run --paths-to-mutate=src/ || true
          fi
